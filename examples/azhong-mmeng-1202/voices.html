<!doctype html><html lang='zh-Hant'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>中文聲音選單</title>
<style>body{font-family:Microsoft JhengHei,sans-serif;max-width:1100px;margin:32px auto;padding:0 24px;background:#f5f6ed;color:#234846;line-height:1.8}h1{margin-bottom:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}fieldset{border:1px solid #99b1a3;border-radius:16px;background:white}legend{font-size:23px;font-weight:bold}label{display:block;padding:8px;border-bottom:1px solid #e4ebe2;cursor:pointer}small{display:block;margin-left:25px;font-size:14px}#chosen{position:sticky;bottom:0;padding:15px;background:#234846;color:white;border-radius:12px}a{color:#28654f}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<h1>中文聲音選單</h1><p>男童 3 款、女童 4 款、成人男女各 8 款。先選聲音，再製作配音；這裡不會自動送出或產生費用。</p><p>台灣標示依官方清單；其他聲線不冒充台灣口音。網站可能有驗證碼與排隊。<a href='https://ttsmaker.com/zh-cn' target='_blank' rel='noopener'>開啟官方免費試聽與配音頁</a></p><div class='grid'><fieldset><legend>男童</legend><label><input type='radio' name='voice' value='1202'> <strong>萌萌 1202</strong><small>未標台灣；一般中文候選</small></label><label><input type='radio' name='voice' value='1401'> <strong>明明 1401</strong><small>未標台灣；一般中文候選</small></label><label><input type='radio' name='voice' value='1402'> <strong>小華 1402</strong><small>未標台灣；一般中文候選</small></label></fieldset><fieldset><legend>女童</legend><label><input type='radio' name='voice' value='1203'> <strong>甜甜 1203</strong><small>未標台灣；一般中文候選</small></label><label><input type='radio' name='voice' value='1522'> <strong>糖豆 1522</strong><small>未標台灣；一般中文候選</small></label><label><input type='radio' name='voice' value='1523'> <strong>雪花 1523</strong><small>未標台灣；一般中文候選</small></label><label><input type='radio' name='voice' value='1416'> <strong>莉莉 1416</strong><small>未標台灣；一般中文候選</small></label></fieldset><fieldset><legend>成人男聲</legend><label><input type='radio' name='voice' value='1602'> <strong>家豪 1602</strong><small>官方明列台灣</small></label><label><input type='radio' name='voice' value='349'> <strong>阿澤 349</strong><small>一般中文；未標台灣</small></label><label><input type='radio' name='voice' value='999'> <strong>樊雨 999</strong><small>一般中文；未標台灣</small></label><label><input type='radio' name='voice' value='345'> <strong>元芳 345</strong><small>一般中文；未標台灣</small></label><label><input type='radio' name='voice' value='1508'> <strong>阿飛 1508</strong><small>一般中文；未標台灣</small></label><label><input type='radio' name='voice' value='1506'> <strong>啊樂 1506</strong><small>一般中文；未標台灣</small></label><label><input type='radio' name='voice' value='1515'> <strong>小龍 1515</strong><small>一般中文；未標台灣</small></label><label><input type='radio' name='voice' value='1660'> <strong>柏宇 1660</strong><small>多語種；未標台灣</small></label></fieldset><fieldset><legend>成人女聲</legend><label><input type='radio' name='voice' value='889'> <strong>菡穎 889</strong><small>官方明列台灣</small></label><label><input type='radio' name='voice' value='1601'> <strong>雅婷 1601</strong><small>官方明列台灣</small></label><label><input type='radio' name='voice' value='1606'> <strong>淑芬 1606</strong><small>官方明列台灣</small></label><label><input type='radio' name='voice' value='1603'> <strong>麗娜 1603</strong><small>港台風格；不等同原生台灣口音</small></label><label><input type='radio' name='voice' value='1604'> <strong>婉君 1604</strong><small>港台風格；不等同原生台灣口音</small></label><label><input type='radio' name='voice' value='204'> <strong>瀟瀟 204</strong><small>一般中文；未標台灣</small></label><label><input type='radio' name='voice' value='1406'> <strong>安妮 1406</strong><small>一般中文；未標台灣</small></label><label><input type='radio' name='voice' value='346'> <strong>夢夢 346</strong><small>一般中文；未標台灣</small></label></fieldset></div><p id='chosen' role='status'>尚未選聲音。請先試聽，再將聲線編號告訴工作流。</p><script>for(const input of document.querySelectorAll('input'))input.onchange=()=>{document.getElementById('chosen').textContent='你選擇：'+input.parentElement.querySelector('strong').textContent+'。請將這個編號告訴工作流，再到官網試聽／產生台詞。';};</script></html>
